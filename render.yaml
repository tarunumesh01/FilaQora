services:
  - type: web
    name: filaqora
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2

    envVars:
      # Flask secret key
      - key: SECRET_KEY
        generateValue: true

      # Render PostgreSQL connection
      - key: DATABASE_URL
        fromDatabase:
          name: filaqora-db
          property: connectionString

      # Python version
      - key: PYTHON_VERSION
        value: "3.12.0"


databases:
  - name: filaqora-db
    plan: free

    databaseName: filaqora

    user: filaqora