{% extends "base.html" %}
{% block title %}Export - FilaQora{% endblock %}

{% block content %}
<div class="container">
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3">Export Customers</h1>
                <p class="text-muted">Use the customer list search and export buttons to download filtered records.</p>
                <div class="d-flex gap-2">
                    <a class="btn btn-primary" href="{{ url_for('main.export', format='csv') }}">Download CSV</a>
                    <a class="btn btn-success" href="{{ url_for('main.export', format='xlsx') }}">Download Excel</a>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
