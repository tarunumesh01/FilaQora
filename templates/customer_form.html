{% extends "base.html" %}
{% block title %}{{ title }} - FilaQora{% endblock %}

{% block content %}
<div class="container">
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">{{ title }}</h1>
            <a class="btn btn-outline-secondary" href="{{ url_for('main.customers') }}">Back</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="name">Name *</label>
                            <input class="form-control" id="name" name="name" required
                                   value="{{ form_data.get('name', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Email *</label>
                            <input class="form-control" type="email" id="email" name="email" required
                                   value="{{ form_data.get('email', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phone">Phone</label>
                            <input class="form-control" id="phone" name="phone"
                                   value="{{ form_data.get('phone', '') }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="company">Company</label>
                            <input class="form-control" id="company" name="company"
                                   value="{{ form_data.get('company', '') }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="tags">Tags</label>
                            <input class="form-control" id="tags" name="tags"
                                   placeholder="lead, vip, enterprise"
                                   value="{{ form_data.get('tags', '') }}">
                            <div class="form-text">Separate multiple tags with commas.</div>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Save Customer</button>
                            <a class="btn btn-outline-secondary" href="{{ url_for('main.customers') }}">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
